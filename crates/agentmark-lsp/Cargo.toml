[package]
name = "agentmark-lsp"
version = "0.1.0"
edition = "2021"
description = "Language server for AgentMark (stdio), built on the agentmark compiler library"
license = "MIT"

[lib]
name = "agentmark_lsp"
path = "src/lib.rs"

[[bin]]
name = "agentmark-lsp"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
agentmark = { path = "../.." }
agentmark-rt = { path = "../agentmark-rt" }
lsp-server = "0.7"
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
