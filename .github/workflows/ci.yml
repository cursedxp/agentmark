name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      # tests/binder.rs runs `cargo check --offline` against sha2 0.10.9, which only works when the
      # crate is already in the local registry cache; fetch it once here.
      - name: Warm the cargo cache for the offline binder tests
        run: |
          d=$(mktemp -d)
          cargo init -q --lib --name warm "$d"
          echo 'sha2 = "=0.10.9"' >> "$d/Cargo.toml"
          cargo fetch -q --manifest-path "$d/Cargo.toml"
      - name: Test
        run: cargo test --workspace
      - name: Examples are canonical, lint-clean and check clean
        run: tools/guard/check-examples.sh "$PWD/target/debug/agentmark" fmt lint check
      - name: Stop-hook guard tests
        run: tools/guard/test-stop-guard.sh

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/docs-site/package-lock.json
      - name: Build docs site and check in-page links
        working-directory: tools/docs-site
        run: |
          npm ci
          npm run build
          npm run check-links
